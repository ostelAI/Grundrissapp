<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Grundrissplaner</title>
<meta name="description" content="Grundriss fürs eigene Haus planen, Elemente verknüpfen und in 3D begehen.">
<meta name="theme-color" content="#5b5bf0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grundriss">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f8; --surface:#ffffff; --surface-2:#f7f8fb; --ink:#0f172a; --muted:#64748b; --line:#e5e7ef;
  --accent:#5b5bf0; --accent-2:#8b5cf6; --accent-weak:#eef0ff; --accent-ink:#4343d6; --danger:#e5484d; --chip:#f1f3f8;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.07); --shadow-lg:0 20px 50px rgba(16,24,40,.18);
  --r:12px; --grad:linear-gradient(135deg,var(--accent),var(--accent-2));
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0d1016; --surface:#151922; --surface-2:#1b202a; --ink:#e8ebf2; --muted:#95a0b5; --line:#252b37;
    --accent:#7c7cff; --accent-2:#a78bfa; --accent-weak:#232647; --accent-ink:#a5a5ff; --danger:#ff6369; --chip:#1e2330;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --shadow-lg:0 20px 50px rgba(0,0,0,.5); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:13.5px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;background:var(--chip);border:1px solid transparent;border-radius:10px;padding:7px 12px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
button:hover{background:var(--accent-weak)}
button:active{transform:scale(.97)}
button:disabled{opacity:.4;pointer-events:none}
button.primary{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(91,91,240,.35)}
button.primary:hover{filter:brightness(1.07)}
button.danger{color:var(--danger)}
button.danger:hover{background:color-mix(in srgb,var(--danger) 12%,transparent)}
button.ghost{background:transparent}
.icon-btn{padding:7px;border-radius:10px;background:transparent}
input,select,textarea{font:inherit;color:inherit;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
input[type=color]{padding:2px;height:34px;width:52px;cursor:pointer}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.spacer{flex:1}
.muted{color:var(--muted)}
kbd{font:11px ui-monospace,monospace;background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:0 5px}

/* ---------- App-Rahmen ---------- */
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
#topbar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
#projName{font-weight:600;background:transparent;border-color:transparent;width:190px;font-size:14.5px}
#projName:hover{border-color:var(--line)}
#floorTabs{display:flex;gap:2px;overflow-x:auto;background:var(--chip);padding:3px;border-radius:12px;scrollbar-width:none;flex:none;max-width:45vw}
#floorTabs button{padding:5px 12px;border-radius:9px;background:transparent;font-weight:500;color:var(--muted)}
#floorTabs button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg{display:flex;background:var(--chip);padding:3px;border-radius:12px;gap:2px}
.seg button{padding:5px 12px;border-radius:9px;background:transparent;font-weight:500;color:var(--muted)}
.seg button.active{background:var(--surface);color:var(--accent-ink);box-shadow:var(--shadow)}
.menu{position:relative}
.dropdown{display:none;position:absolute;right:0;top:44px;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow-lg);padding:6px;z-index:60;min-width:270px}
.dropdown.open{display:block;animation:pop .15s ease-out}
.dropdown button{display:flex;width:100%;text-align:left;background:transparent;padding:9px 10px}
.dropdown button:hover{background:var(--accent-weak)}
.dropdown hr{border:none;border-top:1px solid var(--line);margin:5px 4px}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}

main{display:grid;grid-template-columns:76px 1fr 340px;min-height:0}
#tools{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px;padding:8px 7px;overflow-y:auto;scrollbar-width:none}
#tools button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;background:transparent;font-size:10.5px;font-weight:500;color:var(--muted);border-radius:12px}
#tools button:hover{background:var(--chip);color:var(--ink)}
#tools button.active{background:var(--accent-weak);color:var(--accent-ink)}
#tools button svg{width:22px;height:22px}
#tools hr{border:none;border-top:1px solid var(--line);width:70%;margin:3px auto}

#stage{position:relative;display:flex;min-width:0;min-height:0}
#wrap2d,#wrap3d{position:relative;flex:1;min-width:0;overflow:hidden}
#wrap3d{border-left:1px solid var(--line)}
#stage.m2d #wrap3d{display:none}
#stage.m3d #wrap2d{display:none}
#stage.m3d #wrap3d{border-left:none}
#cv{display:block;touch-action:none}
#wrap3d canvas{display:block;touch-action:none}
#hud{position:absolute;pointer-events:none;background:rgba(15,23,42,.88);color:#fff;padding:4px 9px;border-radius:8px;font-size:12px;display:none;white-space:nowrap;z-index:4}
.floatbar{position:absolute;left:12px;top:12px;right:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;pointer-events:none;z-index:3}
.floatbar>*{pointer-events:auto}
.pill{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:14px;padding:6px 8px;box-shadow:var(--shadow)}
#toolopts:empty{display:none}
#toolopts .chip{padding:5px 9px;border-radius:9px;font-size:12.5px}
#toolopts .chip.active{background:var(--accent);color:#fff}
#toolopts input{width:74px;padding:5px 8px}
#opts3d label{display:flex;gap:5px;align-items:center;font-size:12.5px}
#opts3d select{padding:4px 6px}
#walkBtn.active{background:var(--grad);color:#fff}
#walkHud{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:5;pointer-events:none}
#walkHud.show{display:flex}
#walkHud .card{pointer-events:auto;background:rgba(15,23,42,.86);backdrop-filter:blur(8px);color:#fff;border-radius:18px;padding:20px 24px;max-width:340px;text-align:center;cursor:pointer;line-height:1.7;box-shadow:var(--shadow-lg)}
#walkHud .card b{font-size:16px}
#walkHud kbd{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.25);color:#fff}
#crosshair{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(0,0,0,.4);display:none;z-index:2;pointer-events:none}
#walkInfo{position:absolute;right:12px;bottom:12px;background:rgba(15,23,42,.78);color:#fff;border-radius:10px;padding:5px 11px;font-size:12px;display:none;z-index:2;pointer-events:none}
#joy{position:absolute;left:22px;bottom:22px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.5);
  backdrop-filter:blur(4px);display:none;z-index:4;touch-action:none}
#joy::after{content:"";position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,255,255,.85);
  transform:translate(var(--jx,0px),var(--jy,0px));box-shadow:0 2px 8px rgba(0,0,0,.3)}
.walking #joy.touch{display:block}
.zoombar{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:2px;padding:4px;z-index:3}
.zoombar button{background:transparent;padding:7px}

/* ---------- Seitenleiste ---------- */
#panel{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#panelGrab{display:none}
#panelBody{overflow-y:auto;padding:16px;flex:1}
#panel h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px;font-weight:650}
#panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:20px 0 8px;font-weight:600}
.row{display:grid;grid-template-columns:112px 1fr auto;gap:8px;align-items:center;margin-bottom:7px}
.row label{color:var(--muted);font-size:12.5px}
.row .unit{color:var(--muted);font-size:12px;min-width:18px}
.row input:not([type=checkbox]):not([type=color]),.row select{width:100%}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.list{display:flex;flex-direction:column;gap:1px}
.list .it{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:10px;cursor:pointer}
.list .it:hover{background:var(--chip)}
.list .it .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .it .sub{color:var(--muted);font-size:12px;white-space:nowrap}
.list .it .x{background:transparent;padding:2px 6px;color:var(--muted)}
.swatch{width:14px;height:14px;border-radius:5px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.kv{display:grid;grid-template-columns:1fr 1fr auto;gap:5px;margin-bottom:5px}
.kv input{width:100%}
.kv button{padding:4px 9px}
textarea{width:100%;min-height:72px;resize:vertical}
.total{display:flex;justify-content:space-between;font-weight:600;padding:8px;border-top:1px solid var(--line);margin-top:4px}
.lib{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lib button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;font-size:11.5px;text-align:center;white-space:normal;background:var(--surface-2);border:1px solid var(--line)}
.lib button .ic{font-size:24px}
.lib button.active{background:var(--accent-weak);border-color:var(--accent)}
.hint{background:var(--accent-weak);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:12.5px;line-height:1.55}
.badge{font-size:11px;background:var(--chip);border-radius:20px;padding:1px 8px;color:var(--muted);white-space:nowrap}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.stat div{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.stat b{display:block;font-size:15px;white-space:nowrap}
.stat span{font-size:11px;color:var(--muted)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer;background:var(--chip)}
.photos button{aspect-ratio:1;justify-content:center;flex-direction:column;font-size:11px;border:1.5px dashed var(--line);background:transparent;color:var(--muted)}
.search{width:100%;margin-bottom:8px}

footer#statusbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:5px 12px;background:var(--surface);border-top:1px solid var(--line);color:var(--muted);font-size:12px}
footer#statusbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Hauptmenü ---------- */
#home{position:fixed;inset:0;z-index:40;overflow-y:auto;background:var(--bg);display:none}
#home.show{display:block;animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.home-in{max-width:1080px;margin:0 auto;padding:28px 20px calc(40px + var(--safe-b))}
.hero{display:flex;align-items:center;gap:16px;margin-bottom:28px}
.hero .logo{width:56px;height:56px;border-radius:16px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 8px 24px rgba(91,91,240,.35);flex:none}
.hero .logo svg{width:30px;height:30px;stroke-width:2}
.hero h1{margin:0;font-size:26px;letter-spacing:-.02em}
.hero p{margin:2px 0 0;color:var(--muted)}
.ver{font-size:12px;font-weight:600;color:var(--accent-ink);background:var(--accent-weak);padding:5px 10px;border-radius:20px}
#home h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:26px 0 12px;font-weight:600;display:flex;align-items:center;gap:8px}
.new-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.new-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:16px;border-radius:16px;background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--shadow);white-space:normal}
.new-card:hover{border-color:var(--accent);background:var(--surface)}
.new-card .ni{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-weak);color:var(--accent-ink);margin-bottom:4px}
.new-card.hl .ni{background:var(--grad);color:#fff}
.new-card b{font-size:14.5px}
.new-card span{color:var(--muted);font-size:12.5px;line-height:1.4}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.proj{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}
.proj:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.proj .th{aspect-ratio:16/10;background:#fbfbf8 center/contain no-repeat;border-bottom:1px solid var(--line)}
.proj .meta{padding:12px 14px;display:flex;align-items:center;gap:8px}
.proj .meta div{flex:1;min-width:0}
.proj .meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj .meta span{font-size:12px;color:var(--muted)}
.empty{padding:36px 20px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:16px}
.home-foot{margin-top:34px;color:var(--muted);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- Dialoge & Toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(10,14,22,.45);backdrop-filter:blur(3px);z-index:80;display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);width:min(440px,100%);max-height:88vh;overflow:auto;padding:22px;animation:pop .18s ease-out}
.modal.wide{width:min(760px,100%)}
.modal h3{margin:0 0 12px;font-size:18px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.modal .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.modal .field label{font-size:12.5px;color:var(--muted)}
.modal .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal img.full{width:100%;border-radius:12px;display:block}
.changelog h4{margin:14px 0 4px}
.changelog ul{margin:0;padding-left:20px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:rgba(15,23,42,.92);color:#fff;
  padding:9px 16px;border-radius:12px;font-size:13px;z-index:90;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- Handy / schmale Fenster ---------- */
.only-mobile{display:none}
@media (max-width:1100px){ main{grid-template-columns:72px 1fr 300px} }
@media (max-width:760px){
  .only-mobile{display:revert}
  .split-only,.hide-mobile{display:none!important}
  #app{grid-template-rows:auto 1fr}
  #topbar{flex-wrap:wrap;padding:6px 8px;gap:4px}
  #projName{flex:1;width:auto;font-size:14px}
  #floorTabs{order:10;max-width:none;width:100%}
  #floorTabs button{flex:1}
  main{grid-template-columns:1fr;padding-bottom:calc(122px + var(--safe-b))}
  #tools{position:fixed;left:0;right:0;bottom:0;flex-direction:row;padding:6px 6px calc(6px + var(--safe-b));overflow-x:auto;z-index:31;
    border-right:none;border-top:1px solid var(--line);gap:2px}
  #tools button{min-width:62px;padding:6px 2px}
  #tools hr{display:none}
  #panel{position:fixed;left:0;right:0;bottom:calc(64px + var(--safe-b));height:58vh;z-index:30;border-left:none;border-radius:20px 20px 0 0;
    box-shadow:0 -10px 30px rgba(0,0,0,.14);transition:height .25s ease;border-top:1px solid var(--line)}
  #panel.collapsed{height:58px}
  #panel.collapsed #panelBody{display:none}
  #panelGrab{display:flex;align-items:center;gap:8px;padding:10px 16px 8px;cursor:pointer;font-weight:600;flex:none;position:relative}
  #panelGrab::before{content:"";position:absolute;left:50%;top:5px;width:38px;height:4px;margin-left:-19px;border-radius:4px;background:var(--line)}
  #panelGrab .chev{margin-left:auto;transition:transform .2s;color:var(--muted)}
  #panel:not(.collapsed) #panelGrab .chev{transform:rotate(180deg)}
  #panelBody{padding-top:4px}
  #panel h2{display:none}
  footer#statusbar{display:none}
  .row{grid-template-columns:100px 1fr auto}
  input,select,textarea{font-size:16px}
  .hero h1{font-size:22px}
  .zoombar{bottom:12px}
  #opts3d label span{display:none}
  #toast{bottom:calc(136px + var(--safe-b))}
  #home #toast{bottom:24px}
}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button class="icon-btn" id="homeBtn" title="Hauptmenü / Projekte" data-icon="home"></button>
    <input id="projName" title="Projektname" aria-label="Projektname">
    <nav id="floorTabs"></nav>
    <div class="spacer hide-mobile"></div>
    <div class="seg" id="viewSeg">
      <button data-v="2d">2D</button><button data-v="split" class="split-only">2D + 3D</button><button data-v="3d">3D</button>
    </div>
    <button class="icon-btn" id="undoBtn" title="Rückgängig (Strg+Z)" data-icon="undo"></button>
    <button class="icon-btn" id="redoBtn" title="Wiederholen (Strg+Y)" data-icon="redo"></button>
    <div class="menu">
      <button class="icon-btn" id="fileBtn" title="Menü" data-icon="more"></button>
      <div class="dropdown" id="fileMenu">
        <button data-act="home"><span data-icon="grid"></span>Alle Projekte</button>
        <hr>
        <button data-act="export"><span data-icon="download"></span>Projekt sichern (.json)</button>
        <button data-act="import"><span data-icon="upload"></span>Projekt öffnen (.json)</button>
        <hr>
        <button data-act="png"><span data-icon="image"></span>Grundriss als Bild (.png)</button>
        <button data-act="glb"><span data-icon="cube"></span>3D-Modell exportieren (.glb)</button>
        <hr>
        <button data-act="install" class="install-btn" style="display:none"><span data-icon="phone"></span>Als App installieren</button>
        <button data-act="about"><span data-icon="info"></span>Was ist neu? <span class="badge app-ver" style="margin-left:auto"></span></button>
      </div>
    </div>
  </header>
  <main>
    <aside id="tools"></aside>
    <section id="stage" class="msplit">
      <div id="wrap2d">
        <canvas id="cv"></canvas>
        <div class="floatbar"><div id="toolopts" class="pill"></div></div>
        <div id="hud"></div>
        <div class="zoombar pill">
          <button id="zoomIn" title="Vergrößern" data-icon="plus"></button>
          <button id="zoomOut" title="Verkleinern" data-icon="minus"></button>
          <button id="zoomFit" title="Alles anzeigen" data-icon="fit"></button>
        </div>
      </div>
      <div id="wrap3d">
        <div class="floatbar"><div id="opts3d" class="pill">
          <label><span>Stockwerke</span>
            <select id="floors3d">
              <option value="upto">bis aktuelles</option>
              <option value="all">alle</option>
              <option value="only">nur aktuelles</option>
            </select>

function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k === 'value') e.value = v;
    else if (k === 'checked') e.checked = !!v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) e.append(c instanceof Node ? c : String(c));
  return e;
}

function modal({ title, body, actions = [], wide = false }) {
  return new Promise(resolve => {

    const close = v => { bg.remove(); document.removeEventListener('keydown', onKey, true); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); close(null); } if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') { const p = actions.find(a => a.primary); if (p) { e.preventDefault(); close(p.value ?? true); } } };
    document.addEventListener('keydown', onKey, true);
    bg.addEventListener('pointerdown', e => { if (e.target === bg) close(null); });
    if (title) box.append(h('h3', {}, title));
    if (body) box.append(body);
    box.append(h('div', { class: 'acts' }, actions.map(a => h('button', { class: a.primary ? 'primary' : a.danger ? 'danger' : '', onclick: () => close(a.value ?? true) }, a.label))));
    bg.append(box); document.body.append(bg);
    setTimeout(() => { const f = box.querySelector('input,select,textarea'); if (f) { f.focus(); if (f.select) f.select(); } }, 30);
  });

/* ---------- Speicher (IndexedDB, Fallback localStorage) ---------- */
const Store = {
  db: null, mem: { projects: new Map(), photos: new Map() },
  async init() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('grundrissplaner', 1);
        r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('projects', { keyPath: 'id' }); d.createObjectStore('photos', { keyPath: 'id' }); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    } catch (e) { this.db = null; console.warn('IndexedDB nicht verfügbar', e); }
  },
  req(store, mode, fn) {
    if (!this.db) return Promise.resolve(fn(null));
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode), r = fn(t.objectStore(store));
      t.oncomplete = () => res(r && 'result' in r ? r.result : undefined); t.onerror = () => rej(t.error);
    });
  },
  all(store) { return this.db ? this.req(store, 'readonly', s => s.getAll()) : Promise.resolve([...this.mem[store].values()]); },
  get(store, id) { return this.db ? this.req(store, 'readonly', s => s.get(id)) : Promise.resolve(this.mem[store].get(id)); },
  put(store, v) { if (!this.db) { this.mem[store].set(v.id, v); return Promise.resolve(); } return this.req(store, 'readwrite', s => s.put(v)); },
  del(store, id) { if (!this.db) { this.mem[store].delete(id); return Promise.resolve(); } return this.req(store, 'readwrite', s => s.delete(id)); },
};

window.addEventListener('keydown', e => {
  if ($('#home').classList.contains('show') || document.querySelector('.modal-bg')) return;
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  keys.shift = e.shiftKey; keys.alt = e.altKey;
  if (walk.active && !typing && !e.ctrlKey && !e.metaKey && walkKey(e, true)) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y' && !typing) { e.preventDefault(); redo(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); exportJSON(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd' && !typing) { e.preventDefault(); duplicateItem(); return; }
  if (typing) { if (e.key === 'Escape') document.activeElement.blur(); return; }
  if (e.key === ' ') { keys.space = true; e.preventDefault(); return; }
  // exakte Längeneingabe beim Wandzeichnen
  if (tool === 'wall' && draft && draft.start) {
    if (/^[0-9.,]$/.test(e.key)) { draft.typed = (draft.typed || '') + e.key; requestDraw(); return; }
    if (e.key === 'Backspace' && draft.typed) { draft.typed = draft.typed.slice(0, -1); requestDraw(); return; }
    if (e.key === 'Enter' && draft.typed) { const s = wallSnap(F()); draft.typed = ''; placeWallTo(s); requestDraw(); return; }
  }
  if (e.key === 'Enter' && tool === 'room' && draft && draft.points) { finishPolyRoom(); return; }
  if (e.key === 'Escape') { if (draft) cancelDraft(); else if (tool !== 'select') setTool('select'); else { selection = null; renderPanel(); } requestDraw(); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') { deleteSelection(); return; }
  if (e.key === 'q' || e.key === 'Q') { rotateItem(e.shiftKey ? -90 : -15); return; }
  if (e.key === 'e' || e.key === 'E') { rotateItem(e.shiftKey ? 90 : 15); return; }
  const t = TOOLS.find(t => t.key === e.key.toLowerCase()); if (t && !e.ctrlKey && !e.metaKey && !e.altKey) setTool(t.id);
  if (e.key === 'Shift') requestDraw();
});

});

function remapFloorIds(nf) {

  for (const w of nf.walls) { w.a = map.get(w.a); w.b = map.get(w.b); }
  for (const o of nf.openings) o.wallId = map.get(o.wallId);
  for (const r of nf.rooms) if (r.auto) r.auto.nodes = r.auto.nodes.map(x => map.get(x));

}
function addFloor(mode) {

  let nf;

  else if (mode === 'down') nf = newFloor(fl.some(f => /keller/i.test(f.name)) ? 'Untergeschoss' : 'Keller', 0, 2.4);
  else { const og = fl.filter(f => f.elevation > 0.1).length; nf = newFloor(og ? `${og + 1}. Obergeschoss` : 'Obergeschoss', 0, top.height); }
  nf.elevation = mode === 'down' ? r3(bottom.elevation - nf.height - nf.slab) : r3(top.elevation + top.height + top.slab);
  project.floors.push(nf); currentFloorId = nf.id; selection = null; renderTabs(); changed(); zoomFit();

}

const T3 = {};
function init3D() {
  const wrap = $('#wrap3d');
  const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
  r.outputColorSpace = THREE.SRGBColorSpace;
  wrap.append(r.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#dde6ee');
  const cam = new THREE.PerspectiveCamera(45, 1, 0.05, 1000); cam.position.set(15, 16, 20);
  const ctl = new OrbitControls(cam, r.domElement); ctl.enableDamping = true; ctl.maxPolarAngle = Math.PI * 0.495;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8d8a80, 1.6));
  const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(18, 30, 12); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 120 });
  sun.shadow.bias = -0.0005; scene.add(sun); scene.add(sun.target);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: '#c9d4bd', roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  const group = new THREE.Group(); scene.add(group);
  Object.assign(T3, { r, scene, cam, ctl, group, sun, ground, fitted: false, mats: new Map() });
  new ResizeObserver(resize3D).observe(wrap); resize3D();

  let down = null;
  r.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
  r.domElement.addEventListener('pointerup', e => {
    if (walk.active) return;
    if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 4) return;
    const rect = r.domElement.getBoundingClientRect();
    const v = new THREE.Vector2(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
    const rc = new THREE.Raycaster(); rc.setFromCamera(v, cam);
    const hit = rc.intersectObjects(group.children, true)[0];
    let o = hit && hit.object; while (o && !o.userData.ref) o = o.parent;
    if (o) selectRef(o.userData.ref); else { selection = null; renderPanel(); requestDraw(); dirty3d = true; }
  });
  const clock = new THREE.Clock();
  (function loop() {
    requestAnimationFrame(loop);
    const dt = Math.min(clock.getDelta(), 0.1);
    if (viewMode === '2d' || !projectOpen) return;
    if (dirty3d) { dirty3d = false; build3D(); }
    if (walk.active) updateWalk(dt); else ctl.update();
    r.render(scene, cam);
  })();
}
function resize3D() {
  if (!T3.r) return; const w = $('#wrap3d'), W = Math.max(1, w.clientWidth), H = Math.max(1, w.clientHeight);
  T3.r.setSize(W, H); T3.cam.aspect = W / H; T3.cam.updateProjectionMatrix();
}
function mat(color, o = {}) {
  const k = color + JSON.stringify(o);

  return T3.mats.get(k);
}

function floorsFor3D() {
  const cur = F(), fl = sortedFloors();
  if (walk.active) return fl.filter(f => f.elevation <= cur.elevation);

}
function build3D() {
  const g = T3.group;

  g.clear();
  const floors = floorsFor3D(), cur = F();
  for (const f of floors) {
    const fg = new THREE.Group(); fg.position.y = f.elevation; g.add(fg);
    const cut = ui.cut && !walk.active && f.id === cur.id ? 1.2 : null;
    const deg = degreeMap(f);
    // Wände
    for (const w of f.walls) {
      const { A, L, u } = wallFrame(f, w); if (L < 1e-4) continue;
      const t = w.thickness, H = cut ? Math.min(cut, wallHeight(f, w)) : wallHeight(f, w), base = -f.slab;
      const ea = (deg.get(w.a) || 0) > 1 ? t / 2 : 0, eb = (deg.get(w.b) || 0) > 1 ? t / 2 : 0;
      const wg = new THREE.Group(); wg.position.set(A.x, 0, A.y); wg.rotation.y = -Math.atan2(u.y, u.x);
      wg.userData.ref = refOf('wall', w.id, f.id);
      const wm = mat(t >= 0.3 ? '#efe9df' : '#f5f2ec');
      const piece = (x0, x1, y0, y1) => { if (x1 - x0 < 1e-4 || y1 - y0 < 1e-4) return; const m = box(x1 - x0, y1 - y0, t, wm); m.position.set((x0 + x1) / 2, (y0 + y1) / 2, 0); wg.add(m); };

        if (o.sill + o.height <= H + 1e-6 || !cut) {

            const leaf = box(o.width - 0.02, lh, 0.04, mat('#a9825a'));
            if (walk.active) {

              const hs = o.flip ? 1 : -1, sd = o.side ? -1 : 1, pivot = new THREE.Group();
              pivot.position.set(o.offset + hs * (o.width / 2 - 0.01), 0, sd * (t / 2 - 0.02));
              pivot.rotation.y = sd * hs * Math.PI / 2 * 0.92;
              leaf.position.set(-hs * (o.width - 0.02) / 2, lh / 2, 0); pivot.add(leaf); og.add(pivot);

    const fl = [...p.floors].sort((a, b) => Math.abs(a.elevation) - Math.abs(b.elevation))[0];
    const nodes = new Map(fl.nodes.map(n => [n.id, n]));
    const pts = [...fl.nodes, ...fl.rooms.flatMap(r => r.points), ...fl.items];
    if (!pts.length) return null;
    const W = 480, H = 300, c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
    g.fillStyle = '#fbfbf8'; g.fillRect(0, 0, W, H);
    const xs = pts.map(q => q.x), ys = pts.map(q => q.y), x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const s = Math.min((W - 48) / Math.max(x1 - x0, 1), (H - 48) / Math.max(y1 - y0, 1)), ox = W / 2 - (x0 + x1) / 2 * s, oy = H / 2 - (y0 + y1) / 2 * s;
    const T = q => [q.x * s + ox, q.y * s + oy];
    for (const r of fl.rooms) { g.beginPath(); r.points.forEach((q, i) => g[i ? 'lineTo' : 'moveTo'](...T(q))); g.closePath(); g.fillStyle = r.color; g.fill(); }
    for (const it of fl.items) { if (it.w < 0.2) continue; const [x, y] = T(it); g.save(); g.translate(x, y); g.rotate(it.rot * Math.PI / 180); g.fillStyle = it.color + 'cc'; g.fillRect(-it.w * s / 2, -it.d * s / 2, it.w * s, it.d * s); g.restore(); }
    g.strokeStyle = '#3a404c'; g.lineCap = 'square';
    for (const w of fl.walls) { const a = nodes.get(w.a), b = nodes.get(w.b); if (!a || !b) continue; g.lineWidth = Math.max(2, w.thickness * s); g.beginPath(); g.moveTo(...T(a)); g.lineTo(...T(b)); g.stroke(); }
    return c.toDataURL('image/jpeg', 0.82);
  } catch (e) { return null; }
}
