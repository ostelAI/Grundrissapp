<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grundrissplaner</title>
<style>
:root{
  --bg:#eceff3; --panel:#ffffff; --ink:#1d2330; --muted:#6b7380; --line:#dde1e7;
  --accent:#2f6fec; --accent-weak:#e7efff; --danger:#d64545; --chip:#f3f5f8;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14171c; --panel:#1c2027; --ink:#e7e9ee; --muted:#98a0ac; --line:#2c323b;
    --accent:#5b8ff9; --accent-weak:#223252; --danger:#f06a6a; --chip:#252a33; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:grid;grid-template-rows:48px 1fr 26px;overflow:hidden}
button{font:inherit;color:inherit;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.danger{color:var(--danger)}
input,select,textarea{font:inherit;color:inherit;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:4px 7px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=color]{padding:1px;height:28px;width:44px}
input[type=checkbox]{width:16px;height:16px}

header{display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:6px;font-weight:600}
.brand input{font-weight:600;background:transparent;border-color:transparent;width:170px}
.brand input:hover{border-color:var(--line)}
#floorTabs{display:flex;gap:4px;overflow-x:auto}
#floorTabs button{white-space:nowrap}
#floorTabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.spacer{flex:1}
.seg{display:flex}
.seg button{border-radius:0}
.seg button:first-child{border-radius:6px 0 0 6px}
.seg button:last-child{border-radius:0 6px 6px 0}
.seg button+button{border-left:none}
.seg button.active{background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}
.menu{position:relative}
.dropdown{display:none;position:absolute;right:0;top:34px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;z-index:20;min-width:240px}
.dropdown.open{display:block}
.dropdown button{display:block;width:100%;text-align:left;border:none;background:transparent}
.dropdown button:hover{background:var(--accent-weak)}
.dropdown hr{border:none;border-top:1px solid var(--line);margin:4px 0}

main{display:grid;grid-template-columns:64px 1fr 320px;min-height:0}
#tools{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:6px;overflow-y:auto}
#tools button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-color:transparent;background:transparent;font-size:10.5px}
#tools button .ic{font-size:18px;line-height:1.1}
#tools button.active{background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}
#tools hr{border:none;border-top:1px solid var(--line);width:100%;margin:2px 0}

#stage{position:relative;display:flex;min-width:0;min-height:0}
#wrap2d,#wrap3d{position:relative;flex:1;min-width:0;overflow:hidden}
#wrap3d{border-left:1px solid var(--line)}
#stage.m2d #wrap3d{display:none}
#stage.m3d #wrap2d{display:none}
#cv{display:block;touch-action:none}
#wrap3d canvas{display:block}
#hud{position:absolute;pointer-events:none;background:rgba(20,24,32,.85);color:#fff;padding:3px 8px;border-radius:6px;font-size:12px;display:none;white-space:nowrap}
#toolopts{position:absolute;left:10px;top:10px;display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:5px 8px;box-shadow:0 2px 10px rgba(0,0,0,.08);flex-wrap:wrap;max-width:calc(100% - 20px)}
#toolopts:empty{display:none}
#toolopts .chip{padding:3px 8px}
#toolopts .chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
#opts3d{position:absolute;left:10px;top:10px;display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:5px 8px;box-shadow:0 2px 10px rgba(0,0,0,.08);z-index:2;flex-wrap:wrap}
#opts3d label{display:flex;gap:4px;align-items:center}
#walkBtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
#walkHud{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:3;pointer-events:none}
#walkHud.show{display:flex}
#walkHud .card{pointer-events:auto;background:rgba(20,24,32,.82);color:#fff;border-radius:12px;padding:18px 22px;max-width:360px;text-align:center;cursor:pointer;line-height:1.6}
#walkHud .card b{font-size:15px}
#walkHud kbd{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.25);color:#fff}
#crosshair{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(0,0,0,.4);display:none;z-index:2;pointer-events:none}
#walkInfo{position:absolute;right:10px;top:10px;background:rgba(20,24,32,.75);color:#fff;border-radius:8px;padding:4px 10px;font-size:12px;display:none;z-index:2;pointer-events:none}
.zoombar{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}
.zoombar button{background:var(--panel);width:32px;padding:4px}

#panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:12px}
#panel h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:6px}
#panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 6px;font-weight:600}
.row{display:grid;grid-template-columns:110px 1fr auto;gap:6px;align-items:center;margin-bottom:6px}
.row label{color:var(--muted)}
.row .unit{color:var(--muted);font-size:12px;min-width:16px}
.row input:not([type=checkbox]):not([type=color]),.row select{width:100%}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.list{display:flex;flex-direction:column;gap:2px}
.list .it{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:6px;cursor:pointer}
.list .it:hover{background:var(--accent-weak)}
.list .it .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .it .sub{color:var(--muted);font-size:12px;white-space:nowrap}
.list .it .x{border:none;background:transparent;padding:0 4px;color:var(--muted)}
.list .it .x:hover{color:var(--danger)}
.swatch{width:12px;height:12px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.15)}
.kv{display:grid;grid-template-columns:1fr 1fr auto;gap:4px;margin-bottom:4px}
.kv input{width:100%}
.kv button{padding:2px 7px}
textarea{width:100%;min-height:60px;resize:vertical}
.muted{color:var(--muted)}
.total{display:flex;justify-content:space-between;font-weight:600;padding:6px;border-top:1px solid var(--line);margin-top:4px}
.lib{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.lib button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11px;text-align:center}
.lib button .ic{font-size:20px}
.lib button.active{background:var(--accent-weak);border-color:var(--accent)}
.hint{background:var(--accent-weak);border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:12.5px}
.badge{font-size:11px;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:0 7px;color:var(--muted)}

footer{display:flex;justify-content:space-between;align-items:center;padding:0 10px;background:var(--panel);border-top:1px solid var(--line);color:var(--muted);font-size:12px}
footer span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font:11px ui-monospace,monospace;background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:0 4px}

@media (max-width:900px){
  main{grid-template-columns:56px 1fr}
  #panel{position:fixed;right:0;top:48px;bottom:26px;width:290px;z-index:10;box-shadow:-8px 0 20px rgba(0,0,0,.15)}
  #panel.collapsed{display:none}
}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",

} }

<body>
<header>
  <div class="brand">🏠 <input id="projName" title="Projektname"></div>
  <nav id="floorTabs"></nav>
  <div class="spacer"></div>
  <div class="seg" id="viewSeg">
    <button data-v="2d">2D</button><button data-v="split">2D | 3D</button><button data-v="3d">3D</button>
  </div>
  <button id="undoBtn" title="Rückgängig (Strg+Z)">↶</button>
  <button id="redoBtn" title="Wiederholen (Strg+Y)">↷</button>
  <div class="menu">
    <button id="fileBtn">Datei ▾</button>
    <div class="dropdown" id="fileMenu">
      <button data-act="new">Neues leeres Projekt</button>
      <button data-act="sample">Beispielhaus laden</button>
      <hr>
      <button data-act="export">Projekt speichern (.json)</button>
      <button data-act="import">Projekt öffnen (.json)</button>
      <hr>
      <button data-act="png">Grundriss als Bild (.png)</button>
      <button data-act="glb">3D-Modell exportieren (.glb)</button>
    </div>
  </div>
</header>
<main>
  <aside id="tools"></aside>
  <section id="stage" class="msplit">
    <div id="wrap2d">
      <canvas id="cv"></canvas>
      <div id="toolopts"></div>
      <div id="hud"></div>
      <div class="zoombar">
        <button id="zoomIn" title="Vergrößern">+</button>
        <button id="zoomOut" title="Verkleinern">−</button>
        <button id="zoomFit" title="Alles anzeigen">⤢</button>
      </div>
    </div>
    <div id="wrap3d">
      <div id="opts3d">

          <select id="floors3d">

        <button id="reset3d">Ansicht zurücksetzen</button>
        <button id="walkBtn" title="Durch das Haus laufen">🚶 Rundgang</button>
      </div>
      <div id="crosshair"></div>
      <div id="walkInfo"></div>
      <div id="walkHud"><div class="card" id="walkCard">
        <b>🚶 Rundgang</b><br>Klicken zum Starten<br>
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / Pfeile laufen · Maus umsehen<br>
        <kbd>Shift</kbd> rennen · Treppen einfach hochlaufen<br>
        Doppelklick im 2D-Plan = dorthin springen<br>
        <kbd>Esc</kbd> Pause · nochmal <kbd>Esc</kbd> beendet
      </div></div>
    </div>
  </section>
  <aside id="panel"></aside>
</main>
<footer><span id="status"></span><span id="coords"></span></footer>
<input type="file" id="fileInput" accept=".json,application/json" hidden>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

/* =====================================================================
   Grundlagen
   ===================================================================== */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const STORE_KEY = 'grundrissplaner.v1';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const fmt = (n, d = 2) => Number(n).toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
const r3 = v => Math.round(v * 1000) / 1000;
const clone = o => JSON.parse(JSON.stringify(o));

function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k === 'value') e.value = v;
    else if (k === 'checked') e.checked = !!v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) e.append(c instanceof Node ? c : String(c));
  return e;
}

/* =====================================================================
   Objekt-Bibliothek
   ===================================================================== */
const LIB = [
  { cat: 'Möbel', items: [
    { key: 'bett', name: 'Doppelbett', ic: '🛏️', w: 1.8, d: 2.0, h: 0.5, color: '#c8b49a' },
    { key: 'einzelbett', name: 'Einzelbett', ic: '🛏️', w: 0.9, d: 2.0, h: 0.5, color: '#c8b49a' },
    { key: 'sofa', name: 'Sofa', ic: '🛋️', w: 2.2, d: 0.9, h: 0.85, color: '#7d8fa6' },
    { key: 'sessel', name: 'Sessel', ic: '💺', w: 0.85, d: 0.85, h: 0.85, color: '#7d8fa6' },
    { key: 'tisch', name: 'Esstisch', ic: '🍽️', w: 1.6, d: 0.9, h: 0.75, color: '#a07850' },
    { key: 'stuhl', name: 'Stuhl', ic: '🪑', w: 0.45, d: 0.5, h: 0.9, color: '#8a6644' },
    { key: 'schreibtisch', name: 'Schreibtisch', ic: '🖥️', w: 1.4, d: 0.7, h: 0.75, color: '#b8a080' },
    { key: 'schrank', name: 'Kleiderschrank', ic: '🚪', w: 2.0, d: 0.6, h: 2.2, color: '#d9cbb5' },
    { key: 'regal', name: 'Regal', ic: '📚', w: 1.0, d: 0.35, h: 1.9, color: '#b08d63' },
    { key: 'tv', name: 'TV-Board', ic: '📺', w: 1.8, d: 0.4, h: 0.5, color: '#555b66' },
  ]},
  { cat: 'Küche', items: [
    { key: 'kueche', name: 'Küchenzeile', ic: '🍳', w: 2.4, d: 0.6, h: 0.9, color: '#e8e2d6' },
    { key: 'insel', name: 'Kochinsel', ic: '🏝️', w: 1.8, d: 0.9, h: 0.9, color: '#e8e2d6' },
    { key: 'kuehlschrank', name: 'Kühlschrank', ic: '🧊', w: 0.6, d: 0.65, h: 1.8, color: '#dfe6ea' },
    { key: 'herd', name: 'Herd', ic: '🔥', w: 0.6, d: 0.6, h: 0.9, color: '#3a3f47' },
    { key: 'spuele', name: 'Spüle', ic: '🚰', w: 0.8, d: 0.6, h: 0.9, color: '#cfd6dc' },
  ]},
  { cat: 'Bad', items: [
    { key: 'wc', name: 'WC', ic: '🚽', w: 0.4, d: 0.65, h: 0.8, color: '#f4f6f8' },
    { key: 'waschbecken', name: 'Waschbecken', ic: '🚰', w: 0.6, d: 0.45, h: 0.85, color: '#f4f6f8' },
    { key: 'dusche', name: 'Dusche', ic: '🚿', w: 0.9, d: 0.9, h: 0.05, color: '#dbe9f2' },
    { key: 'badewanne', name: 'Badewanne', ic: '🛁', w: 1.7, d: 0.75, h: 0.6, color: '#f4f6f8' },
    { key: 'waschmaschine', name: 'Waschmaschine', ic: '🫧', w: 0.6, d: 0.6, h: 0.85, color: '#eef1f4' },
  ]},
  { cat: 'Elektro & Technik', items: [
    { key: 'steckdose', name: 'Steckdose', ic: '🔌', w: 0.08, d: 0.08, h: 0.08, z: 0.3, color: '#f0f0f0' },
    { key: 'schalter', name: 'Lichtschalter', ic: '🔘', w: 0.08, d: 0.08, h: 0.08, z: 1.05, color: '#f0f0f0' },
    { key: 'lampe', name: 'Deckenlampe', ic: '💡', w: 0.4, d: 0.4, h: 0.15, z: 'ceil', color: '#ffd36b' },
    { key: 'rauchmelder', name: 'Rauchmelder', ic: '🚨', w: 0.12, d: 0.12, h: 0.05, z: 'ceil', color: '#fafafa' },
    { key: 'netzwerk', name: 'Netzwerkdose', ic: '🌐', w: 0.08, d: 0.08, h: 0.08, z: 0.3, color: '#f0f0f0' },
    { key: 'sicherung', name: 'Sicherungskasten', ic: '⚡', w: 0.5, d: 0.15, h: 0.7, z: 1.2, color: '#cfd3d8' },
    { key: 'heizung', name: 'Heizkörper', ic: '♨️', w: 1.0, d: 0.1, h: 0.6, z: 0.15, color: '#e6e6e6' },
  ]},
  { cat: 'Sonstiges', items: [
    { key: 'treppe', name: 'Treppe', ic: '🪜', w: 1.0, d: 3.0, h: 2.8, color: '#9c8468' },
    { key: 'pflanze', name: 'Pflanze', ic: '🪴', w: 0.5, d: 0.5, h: 1.2, color: '#5d9b5d' },
    { key: 'teppich', name: 'Teppich', ic: '🟫', w: 2.0, d: 1.4, h: 0.01, color: '#b5654a' },
    { key: 'box', name: 'Objekt', ic: '📦', w: 0.5, d: 0.5, h: 0.5, color: '#9aa5b1' },
  ]},
];
const LIBMAP = Object.fromEntries(LIB.flatMap(c => c.items).map(i => [i.key, i]));
const ROOM_COLORS = ['#f6d7a7', '#c9e4c5', '#bcd8ee', '#f2c4ce', '#d9cdee', '#f3e7a6', '#c6e7e3', '#e8d2bd'];
const ROOM_NAMES = ['Wohnzimmer', 'Küche', 'Esszimmer', 'Schlafzimmer', 'Kinderzimmer', 'Bad', 'WC', 'Flur', 'Diele',
  'Arbeitszimmer', 'Gästezimmer', 'Abstellraum', 'Hauswirtschaftsraum', 'Ankleide', 'Keller', 'Heizungsraum', 'Garage', 'Terrasse', 'Balkon'];

/* =====================================================================
   Projekt / Datenmodell
   ===================================================================== */
function newFloor(name, elevation = 0, height = 2.6) {
  return { id: uid(), name, elevation, height, slab: 0.25, nodes: [], walls: [], openings: [], rooms: [], items: [] };
}
function newProject() {
  return { name: 'Mein Haus', version: 1, floors: [newFloor('Erdgeschoss')], links: [],
    settings: { grid: 0.05, wallThickness: 0.24, showDims: true, showGhost: true } };
}
function normalize(p) {
  p.settings = Object.assign({ grid: 0.05, wallThickness: 0.24, showDims: true, showGhost: true }, p.settings || {});
  p.links = p.links || [];
  if (!p.floors || !p.floors.length) p.floors = [newFloor('Erdgeschoss')];
  for (const f of p.floors) for (const k of ['nodes', 'walls', 'openings', 'rooms', 'items']) f[k] = f[k] || [];
  return p;
}
function loadStored() {
  try { const s = localStorage.getItem(STORE_KEY); if (s) return normalize(JSON.parse(s)); } catch (e) { }
  return null;
}

let project = loadStored();
const firstRun = !project;
if (!project) project = newProject();
let currentFloorId = null;
let selection = null;   // {kind, id}
let hover = null;
let tool = 'select';
let libKey = 'sofa';
let draft = null;
let viewMode = window.innerWidth < 1100 ? '2d' : 'split';
const view = { s: 50, ox: 200, oy: 120 };
const ui = { floors3d: 'upto', cut: false };
let dirty3d = true;

const sortedFloors = () => [...project.floors].sort((a, b) => a.elevation - b.elevation);
const F = () => project.floors.find(f => f.id === currentFloorId) || sortedFloors()[0];
const floorById = id => project.floors.find(f => f.id === id);
const N = (f, id) => f.nodes.find(n => n.id === id);
const COLL = { node: 'nodes', wall: 'walls', opening: 'openings', room: 'rooms', item: 'items' };
const findEl = (kind, id, f = F()) => kind === 'link' ? project.links.find(l => l.id === id) : (f[COLL[kind]] || []).find(e => e.id === id);
currentFloorId = sortedFloors()[0].id;

/* ---------- Undo / Speichern ---------- */
let undoStack = [], redoStack = [];
let lastState = JSON.stringify(project);
function persist(s) { try { localStorage.setItem(STORE_KEY, s); } catch (e) { } }
function commit() {
  const s = JSON.stringify(project);
  if (s === lastState) return;
  undoStack.push(lastState); if (undoStack.length > 200) undoStack.shift();
  redoStack = []; lastState = s; persist(s); dirty3d = true; updateUndoBtns();
}
function restore(s) {
  project = normalize(JSON.parse(s)); lastState = s; persist(s);
  if (!floorById(currentFloorId)) currentFloorId = sortedFloors()[0].id;
  if (selection && !findEl(selection.kind, selection.id)) selection = null;
  draft = null; dirty3d = true; refreshAll();
}
function undo() { if (!undoStack.length) return; redoStack.push(lastState); restore(undoStack.pop()); updateUndoBtns(); }
function redo() { if (!redoStack.length) return; undoStack.push(lastState); restore(redoStack.pop()); updateUndoBtns(); }
function updateUndoBtns() { $('#undoBtn').disabled = !undoStack.length; $('#redoBtn').disabled = !redoStack.length; }
function changed(rerender = true) {
  refreshRooms(F()); commit(); requestDraw(); dirty3d = true; if (rerender) renderPanel();
}

/* =====================================================================
   Geometrie
   ===================================================================== */

function polyArea(pts) {

// Polygon nach innen versetzen (offs[i] gilt für Kante i → i+1)

    if (Math.abs(cr) < 1e-6) { out.push({ x: pts[i].x + l2.n.x * offs[i], y: pts[i].y + l2.n.y * offs[i] }); continue; }
    const t = ((l2.p.x - l1.p.x) * l2.d.y - (l2.p.y - l1.p.y) * l2.d.x) / cr;
    out.push({ x: l1.p.x + l1.d.x * t, y: l1.p.y + l1.d.y * t });

/* ---------- Wände & Knoten ---------- */
function degreeMap(f) {
  const m = new Map(); for (const w of f.walls) { m.set(w.a, (m.get(w.a) || 0) + 1); m.set(w.b, (m.get(w.b) || 0) + 1); } return m;
}
function wallBetween(f, a, b) { return f.walls.find(w => (w.a === a && w.b === b) || (w.a === b && w.b === a)); }

function wallHeight(f, w) { return w.height || f.height; }
function wallFrame(f, w) {
  const A = N(f, w.a), B = N(f, w.b), L = dist(A, B) || 1e-9;
  const u = { x: (B.x - A.x) / L, y: (B.y - A.y) / L };
  return { A, B, L, u, n: { x: -u.y, y: u.x } };
}
function wallQuad(f, w, deg) {
  const { A, B, u, n } = wallFrame(f, w), t = w.thickness / 2;
  const ea = (deg.get(w.a) || 0) > 1 ? t : 0, eb = (deg.get(w.b) || 0) > 1 ? t : 0;
  const a = { x: A.x - u.x * ea, y: A.y - u.y * ea }, b = { x: B.x + u.x * eb, y: B.y + u.y * eb };
  return [{ x: a.x + n.x * t, y: a.y + n.y * t }, { x: b.x + n.x * t, y: b.y + n.y * t },
          { x: b.x - n.x * t, y: b.y - n.y * t }, { x: a.x - n.x * t, y: a.y - n.y * t }];
}
function insertNodeInRooms(f, a, b, nid) {
  for (const r of f.rooms) {
    if (!r.auto) continue;
    const s = r.auto.nodes;
    for (let i = 0; i < s.length; i++) {
      const p = s[i], q = s[(i + 1) % s.length];
      if ((p === a && q === b) || (p === b && q === a)) { s.splice(i + 1, 0, nid); break; }
    }

}
function splitWall(f, w, p) {
  const A = N(f, w.a), B = N(f, w.b), L = dist(A, B), pr = projOnSeg(p, A, B);
  if (pr.t * L < 0.01) return w.a;

  const nd = { id: uid(), x: r3(pr.q.x), y: r3(pr.q.y) }; f.nodes.push(nd);
  const w2 = { id: uid(), a: nd.id, b: w.b, thickness: w.thickness, height: w.height || null, name: '', notes: '', props: [] };
  const oldB = w.b; w.b = nd.id; f.walls.push(w2);

function nodeAt(f, p, eps = 0.002) { return f.nodes.find(n => dist(n, p) < eps); }
function resolveSnap(f, s) {

  const nd = { id: uid(), x: r3(s.x), y: r3(s.y) }; f.nodes.push(nd); return nd.id;
}
function addWall(f, aId, bId, thickness) {
  if (aId === bId) return [];

    if (w.a === aId || w.b === aId || w.a === bId || w.b === bId) continue;
    const r = segIntersect(A, B, N(f, w.a), N(f, w.b));
    if (r && r.t > 1e-4 && r.t < 1 - 1e-4 && r.u > 1e-4 && r.u < 1 - 1e-4) hits.push({ t: r.t, w, p: r.p });

  const made = [];
  for (let i = 0; i + 1 < ids.length; i++) {
    if (ids[i] === ids[i + 1] || wallBetween(f, ids[i], ids[i + 1])) continue;
    const w = { id: uid(), a: ids[i], b: ids[i + 1], thickness, height: null, name: '', notes: '', props: [] };

function addWallPts(f, p1, p2, th) {

function snapToGeometry(f, p, tol) {

function removeWall(f, id) {
  f.walls = f.walls.filter(w => w.id !== id);
  const dead = f.openings.filter(o => o.wallId === id).map(o => o.id);
  f.openings = f.openings.filter(o => o.wallId !== id);
  removeLinksTo('wall', id); dead.forEach(d => removeLinksTo('opening', d));
}
function cleanupNodes(f) {
  const used = new Set(); for (const w of f.walls) { used.add(w.a); used.add(w.b); }
  const dead = f.nodes.filter(n => !used.has(n.id)).map(n => n.id);
  f.nodes = f.nodes.filter(n => used.has(n.id)); dead.forEach(d => removeLinksTo('node', d));

function mergeNode(f, fromId, toId) {

    r.auto.nodes = r.auto.nodes.map(x => x === fromId ? toId : x).filter((x, i, a) => x !== a[(i + 1) % a.length]);
  }
  f.nodes = f.nodes.filter(n => n.id !== fromId);

}
function clampOpenings(f) {

    const L = wallLen(f, w); o.width = Math.min(o.width, L); o.offset = clamp(o.offset, o.width / 2, L - o.width / 2);

/* ---------- Räume (automatisch aus Wänden) ---------- */
function findFaces(f) {
  const adj = new Map();
  for (const n of f.nodes) adj.set(n.id, []);
  for (const w of f.walls) {
    const A = N(f, w.a), B = N(f, w.b); if (!A || !B) continue;
    adj.get(w.a).push({ to: w.b, ang: Math.atan2(B.y - A.y, B.x - A.x) });
    adj.get(w.b).push({ to: w.a, ang: Math.atan2(A.y - B.y, A.x - B.x) });
  }
  for (const l of adj.values()) l.sort((a, b) => a.ang - b.ang);
  const used = new Set(), faces = [];
  for (const [u, l] of adj) for (const e of l) {
    if (used.has(u + '>' + e.to)) continue;
    const seq = []; let a = u, b = e.to, guard = 0;
    while (guard++ < 10000) {
      const k = a + '>' + b; if (used.has(k)) break; used.add(k); seq.push(a);
      const lst = adj.get(b), i = lst.findIndex(x => x.to === a), nx = lst[(i - 1 + lst.length) % lst.length];
      a = b; b = nx.to;
    }

  }

}
function cleanCycle(seq) {

  while (ch && s.length > 2) {

    for (let i = 0; i < s.length; i++) {

      if (prev === next) { const j = (i + 1) % s.length; s = s.filter((_, k) => k !== i && k !== j); ch = true; break; }
    }

}
function detectRoomAt(f, p) {
  let best = null, ba = Infinity;
  for (const face of findFaces(f)) {
    const s = cleanCycle(face); if (s.length < 3) continue;
    const pts = s.map(id => N(f, id)); const A = Math.abs(polyArea(pts));
    if (A > 1e-4 && A < ba && pointInPoly(p, pts)) { ba = A; best = s; }
  }

function roomPolyFromNodes(f, ids) {
  const pts = ids.map(id => N(f, id));
  const offs = ids.map((id, i) => ((wallBetween(f, id, ids[(i + 1) % ids.length]) || { thickness: 0 }).thickness) / 2);
  return insetPoly(pts, offs).map(p => ({ x: r3(p.x), y: r3(p.y) }));
}
function refreshRooms(f) {
  for (const r of f.rooms) {
    if (!r.auto) continue;
    const ids = r.auto.nodes;
    const ok = ids.length >= 3 && ids.every(id => N(f, id)) && ids.every((id, i) => wallBetween(f, id, ids[(i + 1) % ids.length]));
    if (!ok) { r.auto = null; continue; }
    r.points = roomPolyFromNodes(f, ids);

}
function addRoomFromNodes(f, ids) {
  const key = [...ids].sort().join('|');
  const ex = f.rooms.find(r => r.auto && [...r.auto.nodes].sort().join('|') === key);
  if (ex) return ex;
  const r = { id: uid(), name: 'Raum ' + (f.rooms.length + 1), color: ROOM_COLORS[f.rooms.length % ROOM_COLORS.length],
    floorMaterial: '', auto: { nodes: ids }, points: roomPolyFromNodes(f, ids), notes: '', props: [] };
  f.rooms.push(r); return r;

/* ---------- Öffnungen ---------- */
function openingFrame(f, o) {
  const w = f.walls.find(x => x.id === o.wallId); if (!w) return null;
  const fr = wallFrame(f, w);
  const c = { x: fr.A.x + fr.u.x * o.offset, y: fr.A.y + fr.u.y * o.offset };
  return { ...fr, w, c };
}
function addOpening(f, w, p, type) {
  const fr = wallFrame(f, w), pr = projOnSeg(p, fr.A, fr.B);
  const def = type === 'window' ? { width: 1.26, height: 1.385, sill: 0.9 } : type === 'passage' ? { width: 1.0, height: 2.1, sill: 0 } : { width: 0.885, height: 2.01, sill: 0 };
  const width = Math.min(def.width, fr.L * 0.9);
  const o = { id: uid(), wallId: w.id, type, name: '', offset: clamp(pr.t * fr.L, width / 2, fr.L - width / 2), width,
    height: def.height, sill: def.sill, flip: false, side: false, notes: '', props: [] };
  f.openings.push(o); return o;
}

/* ---------- Objekte ---------- */
function addItem(f, key, p) {
  const L = LIBMAP[key] || LIBMAP.box;
  const z = L.z === 'ceil' ? f.height - L.h : (L.z || 0);
  const it = { id: uid(), type: L.key, name: L.name, x: r3(p.x), y: r3(p.y), w: L.w, d: L.d, h: L.h, z: r3(z), rot: 0,
    color: L.color, notes: '', props: [] };
  f.items.push(it); return it;

/* ---------- Verknüpfungen ---------- */
function removeLinksTo(kind, id) { project.links = project.links.filter(l => !((l.a.kind === kind && l.a.id === id) || (l.b.kind === kind && l.b.id === id))); }
function refOf(kind, id, floorId = currentFloorId) { return { floorId, kind, id }; }
function resolveRef(ref) { const f = floorById(ref.floorId); if (!f) return null; const el = findEl(ref.kind, ref.id, f); return el ? { f, el } : null; }
function elCenter(f, kind, el) {
  if (kind === 'node' || kind === 'item') return { x: el.x, y: el.y };
  if (kind === 'wall') { const A = N(f, el.a), B = N(f, el.b); return { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 }; }
  if (kind === 'opening') { const fr = openingFrame(f, el); return fr ? fr.c : { x: 0, y: 0 }; }
  if (kind === 'room') return centroid(el.points);
  return { x: 0, y: 0 };
}
const KIND_LABEL = { node: 'Eckpunkt', wall: 'Wand', opening: 'Öffnung', room: 'Raum', item: 'Objekt', link: 'Verknüpfung' };
function elName(f, kind, el) {
  if (kind === 'wall') return el.name || `Wand ${fmt(wallLen(f, el))} m`;
  if (kind === 'opening') return el.name || ({ door: 'Tür', window: 'Fenster', passage: 'Durchgang' }[el.type]);
  if (kind === 'room') return el.name || 'Raum';
  if (kind === 'item') return el.name || 'Objekt';
  if (kind === 'node') return 'Eckpunkt';
  if (kind === 'link') return el.label || 'Verknüpfung';
  return '?';
}
function elIcon(kind, el) {
  if (kind === 'item') return (LIBMAP[el.type] || LIBMAP.box).ic;
  if (kind === 'opening') return el.type === 'window' ? '🪟' : '🚪';
  return { wall: '🧱', room: '⬚', node: '•', link: '🔗' }[kind] || '';
}
function refName(ref) { const r = resolveRef(ref); return r ? elName(r.f, ref.kind, r.el) : '(gelöscht)'; }

/* =====================================================================
   2D-Zeichnen
   ===================================================================== */
const cv = $('#cv'), ctx = cv.getContext('2d');
let CW = 0, CH = 0, dpr = 1, drawQueued = false;
const C = { paper: '#fbfbf8', grid: '#eceee9', grid2: '#dcdfd8', wall: '#3a404c', wallEdge: '#1f232b', ghost: 'rgba(90,110,140,.25)',
  sel: '#2f6fec', hov: 'rgba(47,111,236,.45)', link: '#d6487e', dim: '#56607a', text: '#1d2330' };
const w2s = p => ({ x: p.x * view.s + view.ox, y: p.y * view.s + view.oy });
const s2w = (x, y) => ({ x: (x - view.ox) / view.s, y: (y - view.oy) / view.s });
function resize2D() {
  const r = $('#wrap2d').getBoundingClientRect(); dpr = window.devicePixelRatio || 1;
  CW = Math.max(1, r.width); CH = Math.max(1, r.height);
  cv.width = CW * dpr; cv.height = CH * dpr; cv.style.width = CW + 'px'; cv.style.height = CH + 'px';
  requestDraw();
}
function requestDraw() { if (!drawQueued) { drawQueued = true; requestAnimationFrame(() => { drawQueued = false; draw(); }); } }
function pathPoly(pts) { ctx.beginPath(); pts.forEach((p, i) => { const q = w2s(p); i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y); }); ctx.closePath(); }
function sameRef(a, kind, id) { return a && a.kind === kind && a.id === id; }

function draw() {
  const f = F();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, CW, CH);
  drawGrid();
  const deg = degreeMap(f);

  // darunterliegendes Stockwerk als Schatten
  if (project.settings.showGhost) {
    const below = sortedFloors().filter(x => x.elevation < f.elevation).pop();
    if (below) {
      const dg = degreeMap(below); ctx.fillStyle = C.ghost;
      for (const w of below.walls) { pathPoly(wallQuad(below, w, dg)); ctx.fill(); }
    }
  }
  // Räume
  for (const r of f.rooms) {
    if (r.points.length < 3) continue;
    pathPoly(r.points); ctx.fillStyle = r.color + 'b0'; ctx.fill();
  }
  // Wände: erst Kontur, dann Füllung → Ecken verschmelzen
  const quads = f.walls.map(w => [w, wallQuad(f, w, deg)]);
  ctx.lineJoin = 'miter'; ctx.strokeStyle = C.wallEdge; ctx.lineWidth = 2.2;
  for (const [, q] of quads) { pathPoly(q); ctx.stroke(); }
  for (const [w, q] of quads) { pathPoly(q); ctx.fillStyle = w.thickness >= 0.3 ? C.wall : '#5a6170'; ctx.fill(); }
  // Öffnungen
  for (const o of f.openings) drawOpening(f, o);
  // Maße
  if (project.settings.showDims && view.s > 18) for (const w of f.walls) drawWallDim(f, w);
  // Objekte
  for (const it of f.items) drawItem(it);
  // Raumbeschriftung
  for (const r of f.rooms) if (r.points.length >= 3) drawRoomLabel(r);
  // Verknüpfungen
  drawLinks(f);
  // Knoten
  if (tool === 'select' || tool === 'wall') {
    for (const n of f.nodes) {
      const q = w2s(n), big = sameRef(hover, 'node', n.id) || sameRef(selection, 'node', n.id);
      ctx.beginPath(); ctx.arc(q.x, q.y, big ? 5 : 2.5, 0, Math.PI * 2);
      ctx.fillStyle = big ? C.sel : '#9aa3b2'; ctx.fill();
    }
  }
  // Hervorhebungen
  if (hover && !sameRef(selection, hover.kind, hover.id)) drawHighlight(f, hover, C.hov, 2);
  if (selection) drawHighlight(f, selection, C.sel, 2.5);
  drawToolPreview(f, deg);
  drawWalker();
}

function drawGrid() {
  const steps = [0.1, 0.5, 1, 5, 10, 50];
  const minor = steps.find(s => s * view.s >= 12) || 50;
  const major = minor < 1 ? 1 : minor * 5;
  const tl = s2w(0, 0), br = s2w(CW, CH);

function addFloor(duplicate) {
  const fl = sortedFloors(), top = fl[fl.length - 1], src = F();
  const ogCount = fl.filter(f => f.elevation > 0.1).length + 1;
  let nf;
  if (duplicate) {
    nf = clone(src); nf.id = uid(); nf.name = src.name + ' (Kopie)';
    const map = new Map();
    for (const k of ['nodes', 'walls', 'openings', 'rooms', 'items']) for (const e of nf[k]) { const n = uid(); map.set(e.id, n); e.id = n; }
    for (const w of nf.walls) { w.a = map.get(w.a); w.b = map.get(w.b); }
    for (const o of nf.openings) o.wallId = map.get(o.wallId);
    for (const r of nf.rooms) if (r.auto) r.auto.nodes = r.auto.nodes.map(x => map.get(x));
  } else {
    nf = newFloor(`${ogCount}. Obergeschoss`, 0, top.height);
    // Außenwände übernehmen? → Nur Grundriss des darunterliegenden Stockwerks als Schatten
  }
  nf.elevation = r3(top.elevation + top.height + top.slab);
  if (!duplicate && ogCount === 1) nf.name = 'Obergeschoss';
  project.floors.push(nf); currentFloorId = nf.id; selection = null; renderTabs(); changed();
  status(duplicate ? 'Stockwerk dupliziert und oben angefügt.' : 'Neues Stockwerk – das darunterliegende wird grau angezeigt, damit du die Wände nachzeichnen kannst.');
}

const T3 = {};

  const ctl = new OrbitControls(cam, r.domElement); ctl.enableDamping = true; ctl.maxPolarAngle = Math.PI * 0.495;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8d8a80, 1.6));
  const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(18, 30, 12); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 120 });
  sun.shadow.bias = -0.0005; scene.add(sun); scene.add(sun.target);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: '#c9d4bd', roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

  Object.assign(T3, { r, scene, cam, ctl, group, sun, ground, fitted: false, mats: new Map() });
  new ResizeObserver(resize3D).observe(wrap); resize3D();

  let down = null;
  r.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
  r.domElement.addEventListener('pointerup', e => {
    if (walk.active) return;
    if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 4) return;
    const rect = r.domElement.getBoundingClientRect();

    const rc = new THREE.Raycaster(); rc.setFromCamera(v, cam);

}
function resize3D() {

  T3.r.setSize(W, H); T3.cam.aspect = W / H; T3.cam.updateProjectionMatrix();
}

}
function box(w, hh, d, m) { const me = new THREE.Mesh(new THREE.BoxGeometry(Math.max(w, 0.001), Math.max(hh, 0.001), Math.max(d, 0.001)), m); me.castShadow = true; me.receiveShadow = true; return me; }

function build3D() {

    const deg = degreeMap(f);

    for (const w of f.walls) {
      const { A, L, u } = wallFrame(f, w); if (L < 1e-4) continue;

      const ea = (deg.get(w.a) || 0) > 1 ? t / 2 : 0, eb = (deg.get(w.b) || 0) > 1 ? t / 2 : 0;
